<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Table 3 Year 9 DT Coffee Shop</title>
<style>
:root{--brown:#5d4037;--dark:#4e342e;--cream:#f5eee6;--card:#fff;--line:#e3d8d0;--muted:#766a64}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--cream);color:#3e2723}
header{background:var(--brown);color:#fff;text-align:center;padding:24px 16px}
header h1{margin:0;font-size:30px} header p{margin:7px 0 0}
.container{max-width:1150px;margin:auto;padding:22px 18px 110px}
.welcome{display:flex;align-items:center;gap:15px;margin-bottom:18px}
.welcome h2{margin:0;font-size:25px} .welcome p{margin:4px 0;color:var(--muted)}
.search{margin-left:auto;width:280px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.categories{display:flex;gap:9px;overflow:auto;padding-bottom:4px;margin-bottom:20px}
.cat{border:1px solid var(--line);background:#fff;color:var(--brown);padding:10px 15px;border-radius:20px;white-space:nowrap;cursor:pointer;font-weight:700}
.cat.active,.cat:hover{background:var(--brown);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 7px #0000000d;display:flex;flex-direction:column}
.icon{
  height:140px;
  overflow:hidden;
  background:#faf5f0;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .3s ease;
}

.card:hover .icon img{
  transform:scale(1.05);
}
.card-body{padding:15px;display:flex;flex-direction:column;flex:1}
.category{font-size:12px;color:var(--muted);margin-bottom:7px}
.card h3{margin:0;min-height:42px;font-size:18px}
.price{font-size:17px;font-weight:800;color:var(--brown);margin:11px 0}
.add{border:0;background:var(--brown);color:#fff;padding:11px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:auto}
.add:hover{background:var(--dark)}
.order-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;box-shadow:0 -3px 12px #0001;z-index:10}
.order-bar-inner{max-width:1150px;margin:auto;display:flex;align-items:center;gap:15px}
.order-info{flex:1} .order-info strong{font-size:18px}
.checkout{background:var(--brown);color:#fff;border:0;border-radius:9px;padding:13px 22px;font-weight:800;cursor:pointer}
.drawer{position:fixed;inset:0;background:#0005;display:none;z-index:30}
.drawer.open{display:block}
.panel{position:absolute;right:0;top:0;height:100%;width:min(470px,100%);background:#fff;padding:22px;overflow:auto}
.panel-head{display:flex;align-items:center;margin-bottom:14px}
.panel-head h2{margin:0;flex:1}
.close{border:0;background:#eee;border-radius:8px;padding:9px 12px;cursor:pointer}
.item{border-bottom:1px solid #eee;padding:12px 0}
.item-top{display:flex;gap:8px} .item-name{font-weight:800;flex:1}
.controls{display:flex;align-items:center;gap:8px;margin-top:8px}
.qty-btn{width:30px;height:30px;border:1px solid var(--line);background:#faf7f4;border-radius:7px;cursor:pointer}
.remove{margin-left:auto;border:0;background:transparent;color:#8b5e52;text-decoration:underline;cursor:pointer}
label{display:block;font-weight:700;margin-top:15px}
input,textarea{width:100%;padding:11px;margin-top:6px;border:1px solid #cfc3bb;border-radius:8px;font-size:16px}
textarea{min-height:80px;resize:vertical}
.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;padding:17px 0}
.submit{width:100%;padding:14px;background:var(--brown);color:#fff;border:0;border-radius:9px;font-weight:800;font-size:16px;cursor:pointer}
.note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:30px}
@media(max-width:650px){
 .container{padding:15px 12px 105px} .welcome{display:block}
 .search{width:100%;margin-top:12px} .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .icon{height:90px;font-size:42px} .card-body{padding:11px} .card h3{font-size:15px}
 .order-bar-inner{gap:8px} .checkout{padding:12px 14px}
}
</style>
</head>
<body>
<header>
<h1>☕ Year 9 DT Coffee Shop</h1>
<p>Choose your favourites and place your order</p>
</header>

<main class="container">
<section class="welcome">
<div><h2>What would you like?</h2><p>Tap an item to add it to your order.</p></div>
<input class="search" id="search" placeholder="🔎 Search menu">
</section>
<nav class="categories" id="categories"></nav>
<section class="grid" id="products"></section>
</main>

<div class="order-bar">
<div class="order-bar-inner">
<div class="order-info"><strong>Your order</strong><br><span id="summary">0 items · £0.00</span></div>
<button class="checkout" id="openBasket">View order &amp; checkout</button>
</div>
</div>

<div class="drawer" id="drawer">
<aside class="panel">
<div class="panel-head"><h2>Your order</h2><button class="close" id="close">✕</button></div>
<div id="basket"></div>

<form id="form" action="https://formsubmit.co/year9dtcoffeeshop@outlook.com" method="POST">
<input type="hidden" name="_subject" value="New Year 9 DT Coffee Shop Order Table 3">
<input type="hidden" name="_template" value="table">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="Order Items" id="itemsField">
<input type="hidden" name="Order Total" id="totalField">

<label for="name">Your name</label>
<input id="name" name="Customer Name" required placeholder="Enter your name">

<label for="requests">Special requests (optional)</label>
<textarea name="Special Requests" id="requests" placeholder="Anything we should know?"></textarea>

<div class="total"><span>Total</span><span>£<span id="total">0.00</span></span></div>
<button class="submit" type="submit">Place Order</button>
<div class="note">No payment is required. This button sends your order to the coffee shop email through FormSubmit.</div>
</form>
</aside>
</div>

let basket=[];
let active="All";
let search="";


function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c])}
function money(n){return Number(n).toFixed(2)}
function renderCats(){
 const cats=["All",...new Set(PRODUCTS.map(p=>p.category))];
 document.getElementById("categories").innerHTML=cats.map(c=>`<button class="cat ${c===active?"active":""}" onclick="setCat('${esc(c).replace(/'/g,"\\'")}')">${esc(c)}</button>`).join("");
}
function setCat(c){active=c;renderCats();renderProducts()}
function renderProducts(){
 const q=search.toLowerCase();
 const list=PRODUCTS.map((p,i)=>({...p,i})).filter(p=>(active==="All"||p.category===active)&&p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=list.length?list.map(p=>`
 <article class="card">
  <div class="icon"><img src="${p.image}" alt="${esc(p.name)}" loading="lazy"></div>
  <div class="card-body">
   <div class="category">${esc(p.category)}</div>
   <h3>${esc(p.name)}</h3>
   <div class="price">£${money(p.price)}</div>
   <button class="add" onclick="add(${p.i})">Add to order</button>
  </div>
 </article>`).join(""):`<div class="empty">No products found.</div>`;
}
function add(i){
 const p=PRODUCTS[i], x=basket.find(x=>x.name===p.name&&x.category===p.category);
 if(x)x.qty++;else basket.push({...p,qty:1});
 renderBasket();
}
function change(i,n){basket[i].qty+=n;if(basket[i].qty<=0)basket.splice(i,1);renderBasket()}
function removeItem(i){basket.splice(i,1);renderBasket()}
function renderBasket(){
 const count=basket.reduce((s,x)=>s+x.qty,0);
 const total=basket.reduce((s,x)=>s+x.qty*x.price,0);
 document.getElementById("summary").textContent=`${count} item${count===1?"":"s"} · £${money(total)}`;
 document.getElementById("total").textContent=money(total);
 document.getElementById("basket").innerHTML=basket.length?basket.map((x,i)=>`
 <div class="item">
  <div class="item-top"><span class="item-name">${esc(x.name)}</span><b>£${money(x.qty*x.price)}</b></div>
  <div class="note">£${money(x.price)} each</div>
  <div class="controls">
   <button type="button" class="qty-btn" onclick="change(${i},-1)">−</button>
   <span>${x.qty}</span>
   <button type="button" class="qty-btn" onclick="change(${i},1)">+</button>
   <button type="button" class="remove" onclick="removeItem(${i})">Remove</button>
  </div>
 </div>`).join(""):`<div class="empty">Your order is empty.<br>Add something from the menu first.</div>`;
}
document.getElementById("search").oninput=e=>{search=e.target.value;renderProducts()};
document.getElementById("openBasket").onclick=()=>document.getElementById("drawer").classList.add("open");
document.getElementById("close").onclick=()=>document.getElementById("drawer").classList.remove("open");
document.getElementById("drawer").onclick=e=>{if(e.target.id==="drawer")e.currentTarget.classList.remove("open")};
document.getElementById("form").onsubmit=e=>{
 if(!basket.length){e.preventDefault();alert("Please add at least one item to your order.");return}
 const name=document.getElementById("name").value.trim(), cls=document.getElementById("class").value.trim();
 if(!name||!cls){e.preventDefault();return}
 const lines=basket.map(x=>`${x.name} × ${x.qty} = £${money(x.qty*x.price)}`);
 const total=basket.reduce((s,x)=>s+x.qty*x.price,0);
 document.getElementById("itemsField").value=lines.join("\n");
 document.getElementById("totalField").value="£"+money(total)+" (no payment required)";
};
renderCats();renderProducts();renderBasket();
</script>
</body>
</html>
