<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Café POS System</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f0ea;
}

header{
    background:#4e342e;
    color:white;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

.top-bar{
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
}

.filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.filters button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#6f4e37;
    color:white;
}

.filters button:hover{
    background:#4e342e;
}

.container{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    padding:20px;
}

.menu{
    background:white;
    padding:20px;
    border-radius:15px;
}

.items{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.item{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.2s;
}

.item:hover{
    transform:translateY(-4px);
}

.item img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.item-content{
    padding:15px;
}

.item h3{
    margin-bottom:5px;
}

.price{
    color:#6f4e37;
    font-weight:bold;
    font-size:20px;
}

.item button{
    margin-top:10px;
    width:100%;
    padding:10px;
    background:#6f4e37;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.cart{
    background:white;
    padding:20px;
    border-radius:15px;
    position:sticky;
    top:10px;
    height:fit-content;
}

.cart-item{
    margin-bottom:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.qty-btn{
    padding:4px 8px;
    border:none;
    background:#6f4e37;
    color:white;
    border-radius:5px;
    cursor:pointer;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #ddd;
    border-radius:8px;
}

.total{
    font-size:24px;
    font-weight:bold;
    margin-top:15px;
}

.checkout{
    width:100%;
    padding:14px;
    margin-top:15px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    cursor:pointer;
}

.orders,
.sales{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
}

.order{
    border:1px solid #eee;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.status{
    color:#ff8c00;
}

@media(max-width:900px){

.container{
    grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<header>☕ Premium Café POS</header>

<div class="top-bar">

<input
class="search"
id="search"
placeholder="Search products..."
onkeyup="renderProducts()">

<div class="filters">

<button onclick="filterCategory('All')">All</button>
<button onclick="filterCategory('Coffee')">Coffee</button>
<button onclick="filterCategory('Pastry')">Pastry</button>
<button onclick="filterCategory('Pâtisserie')">Pâtisserie</button>
<button onclick="filterCategory('Savoury')">Savoury</button>
<button onclick="filterCategory('Tea & Refreshments')">Tea</button>

</div>

</div>

<div class="container">

<div class="menu">
    <h2>Menu</h2>
    <div class="items" id="menu"></div>
</div>

<div class="cart">

<h2>Current Order</h2>

<div id="cartItems"></div>

<div class="total">
£<span id="total">0.00</span>
</div>

<h3 style="margin-top:20px;">Customer Details</h3>

<input
type="text"
id="customerName"
placeholder="Customer Name"
required>

<select id="orderType">

<option value="">Order Type</option>
<option>Dine In</option>
<option>Takeaway</option>

</select>

<input
type="text"
id="tableNumber"
placeholder="Table Number (optional)">

<button
class="checkout"
onclick="completeOrder()">

Complete Order

</button>

</div>

</div>

<div class="sales">

<h2>Today's Sales</h2>

<h1 id="salesTotal">
£0.00
</h1>

</div>

<div class="orders">

<h2>Order Queue</h2>

<div id="orders"></div>

</div>

let currentCategory = "All";

let cart =
JSON.parse(localStorage.getItem("cafeCart")) || [];

let orders =
JSON.parse(localStorage.getItem("cafeOrders")) || [];

function filterCategory(category){

currentCategory = category;
renderProducts();

}

function renderProducts(){

const menu = document.getElementById("menu");
const search =
document.getElementById("search").value.toLowerCase();

menu.innerHTML="";

products
.filter(product =>
(currentCategory==="All" ||
product.category===currentCategory)
&&
product.name.toLowerCase().includes(search)
)
.forEach(product=>{

const div=document.createElement("div");

div.className="item";

div.innerHTML=

`
<img src="${product.image}" alt="">

<div class="item-content">

<h3>${product.name}</h3>

<p>${product.category}</p>

<p class="price">
£${product.price.toFixed(2)}
</p>

<button
onclick="addToCart('${product.name}',${product.price})">

Add To Order

</button>

</div>
`;

menu.appendChild(div);

});

}

function addToCart(name,price){

const existing =
cart.find(item=>item.name===name);

if(existing){

existing.qty++;

}else{

cart.push({
name,
price,
qty:1
});

}

updateCart();

}

function changeQty(name,value){

const item =
cart.find(x=>x.name===name);

item.qty += value;

if(item.qty<=0)
cart = cart.filter(x=>x.name!==name);

updateCart();

}

function updateCart(){

let total = 0;

const cartItems =
document.getElementById("cartItems");

cartItems.innerHTML="";

cart.forEach(item=>{

total += item.price*item.qty;

cartItems.innerHTML +=

`
<div class="cart-item">

<span>

<button
class="qty-btn"
onclick="changeQty('${item.name}',-1)">

-

</button>

${item.name} x${item.qty}

<button
class="qty-btn"
onclick="changeQty('${item.name}',1)">

+

</button>

</span>

<span>
£${(item.price*item.qty).toFixed(2)}
</span>

</div>
`;

});

document.getElementById("total").innerText =
total.toFixed(2);

localStorage.setItem(
"cafeCart",
JSON.stringify(cart)
);

}

function completeOrder(){

const customer =
document.getElementById("customerName").value.trim();

const orderType =
document.getElementById("orderType").value;

if(cart.length===0){

alert("No items in cart");
return;

}

if(!customer){

alert("Customer name required");
return;

}

if(!orderType){

alert("Select order type");
return;

}

const total = cart.reduce(
(sum,item)=>sum+item.price*item.qty,
0
);

const order = {

id:"#"+Date.now().toString().slice(-6),

customer,

orderType,

items:[...cart],

total,

status:"Preparing",

date:new Date().toLocaleString()

};

orders.unshift(order);

localStorage.setItem(
"cafeOrders",
JSON.stringify(orders)
);

cart = [];

updateCart();
updateOrders();

document.getElementById("customerName").value="";
document.getElementById("orderType").value="";

}

function updateOrders(){

const ordersDiv =
document.getElementById("orders");

ordersDiv.innerHTML="";

orders.forEach(order=>{

ordersDiv.innerHTML +=

`
<div class="order">

<h3>${order.id}</h3>

<p>
${order.customer}
</p>

<p>
${order.orderType}
</p>

<br>

${order.items.map(item=>

`<div>${item.name} x${item.qty}</div>`

).join("")}

<br>

<strong>
£${order.total.toFixed(2)}
</strong>

<div class="status">
${order.status}
</div>

</div>
`;

});

updateSales();

}

function updateSales(){

const totalSales =
orders.reduce(
(sum,order)=>sum+order.total,
0
);

document.getElementById("salesTotal")
.innerText = "£"+totalSales.toFixed(2);

}

renderProducts();
updateCart();
updateOrders();

</script>
