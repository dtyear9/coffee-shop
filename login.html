<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Attempts to inherit styling from the coffee shop site -->
    <link rel="stylesheetb.io/coffee-shop/style.css

    <title>Coffee Shop Login</title>

    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .login-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #error {
            color: red;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Staff Login</h2>

    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>

    <p id="error"></p>
</div>

<script>
(async () => {
    const encoder = new TextEncoder();

    async function sha256(text) {
        const hashBuffer = await crypto.subtle.digest(
            "SHA-256",
            encoder.encode(text)
        );
        return Array.from(new Uint8Array(hashBuffer))
            .map(b => b.toString(16).padStart(2, "0"))
            .join("");
    }

    const expectedHash =
        "11f7d063050e24d55f8d3a8a3f42cb3f7d4261b08d071cf8a8dc879bb3d81aee";

    window.login = async function () {
        const password = document.getElementById("password").value;
        const hash = await sha256(password);

        if (hash === expectedHash) {
            window.location.href =
                "https://dtyear9.github.io/coffee-shop/pos-cafe201234528.html";
        } else {
            document.getElementById("error").textContent =
                "Incorrect password";
        }
    };
})();
</script>

</body>
</html>
